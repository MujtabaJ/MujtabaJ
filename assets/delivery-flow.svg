<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-label="Delivery process: discovery, audit, pilot, evaluate, ship"><title>Delivery process: discovery, audit, pilot, evaluate, ship</title><rect x="0.5" y="0.5" width="1199" height="229" rx="16" fill="#0d1117" stroke="#30363d"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8b949e"/></marker></defs><g font-family="Segoe UI,Helvetica,Arial,sans-serif"><text x="32" y="40" fill="#f0f6fc" font-size="20" font-weight="700">How I deliver an AI feature</text><rect x="32" y="70" width="196" height="124" rx="14" fill="#161b22" stroke="#3987e5" stroke-opacity=".7"/><circle cx="62" cy="102" r="16" fill="#3987e5" fill-opacity=".2" stroke="#3987e5"/><text x="62" y="108" fill="#f0f6fc" font-size="16" font-weight="700" text-anchor="middle">1</text><text x="50" y="148" fill="#f0f6fc" font-size="16" font-weight="600">Discovery call</text><text x="50" y="172" fill="#8b949e" font-size="13">Goal, data, success metric</text><line x1="232" y1="132" x2="264" y2="132" stroke="#8b949e" stroke-width="2" marker-end="url(#ar)" stroke-dasharray="4 4"><animate attributeName="stroke-dashoffset" from="16" to="0" dur="1s" repeatCount="indefinite"/></line><rect x="268" y="70" width="196" height="124" rx="14" fill="#161b22" stroke="#199e70" stroke-opacity=".7"/><circle cx="298" cy="102" r="16" fill="#199e70" fill-opacity=".2" stroke="#199e70"/><text x="298" y="108" fill="#f0f6fc" font-size="16" font-weight="700" text-anchor="middle">2</text><text x="286" y="148" fill="#f0f6fc" font-size="16" font-weight="600">Audit &amp; plan</text><text x="286" y="172" fill="#8b949e" font-size="13">Fixed scope + price</text><line x1="468" y1="132" x2="500" y2="132" stroke="#8b949e" stroke-width="2" marker-end="url(#ar)" stroke-dasharray="4 4"><animate attributeName="stroke-dashoffset" from="16" to="0" dur="1s" repeatCount="indefinite"/></line><rect x="504" y="70" width="196" height="124" rx="14" fill="#161b22" stroke="#c98500" stroke-opacity=".7"/><circle cx="534" cy="102" r="16" fill="#c98500" fill-opacity=".2" stroke="#c98500"/><text x="534" y="108" fill="#f0f6fc" font-size="16" font-weight="700" text-anchor="middle">3</text><text x="522" y="148" fill="#f0f6fc" font-size="16" font-weight="600">Pilot build</text><text x="522" y="172" fill="#8b949e" font-size="13">Working demo on your data</text><line x1="704" y1="132" x2="736" y2="132" stroke="#8b949e" stroke-width="2" marker-end="url(#ar)" stroke-dasharray="4 4"><animate attributeName="stroke-dashoffset" from="16" to="0" dur="1s" repeatCount="indefinite"/></line><rect x="740" y="70" width="196" height="124" rx="14" fill="#161b22" stroke="#d55181" stroke-opacity=".7"/><circle cx="770" cy="102" r="16" fill="#d55181" fill-opacity=".2" stroke="#d55181"/><text x="770" y="108" fill="#f0f6fc" font-size="16" font-weight="700" text-anchor="middle">4</text><text x="758" y="148" fill="#f0f6fc" font-size="16" font-weight="600">Evaluate</text><text x="758" y="172" fill="#8b949e" font-size="13">Accuracy, cost, safety tests</text><line x1="940" y1="132" x2="972" y2="132" stroke="#8b949e" stroke-width="2" marker-end="url(#ar)" stroke-dasharray="4 4"><animate attributeName="stroke-dashoffset" from="16" to="0" dur="1s" repeatCount="indefinite"/></line><rect x="976" y="70" width="196" height="124" rx="14" fill="#161b22" stroke="#2ea043" stroke-opacity=".7"/><circle cx="1006" cy="102" r="16" fill="#2ea043" fill-opacity=".2" stroke="#2ea043"/><text x="1006" y="108" fill="#f0f6fc" font-size="16" font-weight="700" text-anchor="middle">5</text><text x="994" y="148" fill="#f0f6fc" font-size="16" font-weight="600">Ship &amp; support</text><text x="994" y="172" fill="#8b949e" font-size="13">Deploy, monitor, iterate</text></g></svg>