<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" role="img" aria-label="UI preview of the knowledge base assistant demo"><title>UI preview of the knowledge base assistant demo</title><rect x="0.5" y="0.5" width="759" height="469" rx="14" fill="#0d1117" stroke="#30363d"/><g font-family="Segoe UI,Helvetica,Arial,sans-serif"><rect x="1" y="1" width="758" height="40" rx="13" fill="#161b22"/><rect x="1" y="28" width="758" height="13" fill="#161b22"/><circle cx="22" cy="21" r="6" fill="#ff5f57"/><circle cx="42" cy="21" r="6" fill="#febc2e"/><circle cx="62" cy="21" r="6" fill="#28c840"/><text x="380" y="26" fill="#8b949e" font-size="13" text-anchor="middle">Northwind Desk · Knowledge Base Assistant (demo)</text><rect x="1" y="41" width="190" height="428" fill="#0f141b"/><text x="20" y="74" fill="#8b949e" font-size="11" letter-spacing="1.5">SOURCES</text><rect x="12" y="88" width="166" height="28" rx="6" fill="#3987e5" fill-opacity="0.2"/><text x="24" y="107" fill="#f0f6fc" font-size="13">▤ refund-policy.md</text><rect x="12" y="124" width="166" height="28" rx="6" fill="#161b22" fill-opacity="1"/><text x="24" y="143" fill="#c9d1d9" font-size="13">▤ shipping-faq.md</text><rect x="12" y="160" width="166" height="28" rx="6" fill="#161b22" fill-opacity="1"/><text x="24" y="179" fill="#c9d1d9" font-size="13">▤ warranty.pdf</text><rect x="12" y="196" width="166" height="28" rx="6" fill="#161b22" fill-opacity="1"/><text x="24" y="215" fill="#c9d1d9" font-size="13">▤ onboarding.md</text><rect x="12" y="400" width="166" height="50" rx="8" fill="#161b22" stroke="#30363d"/><text x="24" y="420" fill="#8b949e" font-size="11">Retrieval score</text><rect x="24" y="430" width="140" height="6" rx="3" fill="#30363d"/><rect x="24" y="430" width="112" height="6" rx="3" fill="#199e70"/><rect x="386" y="66" width="350" height="46" rx="14" fill="#3987e5"/><text x="402" y="94" fill="#fff" font-size="14">How long do customers have to request a refund?</text><rect x="212" y="130" width="470" height="128" rx="14" fill="#161b22" stroke="#30363d"/><text x="230" y="158" fill="#f0f6fc" font-size="14">Customers can request a refund within 30 days of</text><text x="230" y="180" fill="#f0f6fc" font-size="14">delivery, as long as the item is unused and in its</text><text x="230" y="202" fill="#f0f6fc" font-size="14">original packaging. Refunds go back to the original</text><text x="230" y="224" fill="#f0f6fc" font-size="14">payment method within 5–7 business days.</text><rect x="212" y="266" width="190" height="26" rx="13" fill="#199e70" fill-opacity=".18" stroke="#199e70" stroke-opacity=".6"/><text x="226" y="284" fill="#f0f6fc" font-size="12">[1] refund-policy.md §2</text><rect x="410" y="266" width="120" height="26" rx="13" fill="#2ea043" fill-opacity=".18" stroke="#2ea043" stroke-opacity=".6"/><text x="424" y="284" fill="#f0f6fc" font-size="12">✓ grounded</text><rect x="496" y="312" width="240" height="46" rx="14" fill="#3987e5"/><text x="512" y="340" fill="#fff" font-size="14">What is the CEO’s home address?</text><rect x="212" y="376" width="420" height="40" rx="14" fill="#161b22" stroke="#c98500" stroke-opacity=".6"/><text x="230" y="401" fill="#f0f6fc" font-size="14">⚠ I can’t find that in the documents, so I won’t guess.</text><rect x="212" y="434" width="524" height="1" fill="#30363d"/><text x="214" y="456" fill="#8b949e" font-size="12">Citations on every answer · refuses when unsure · prompt-injection filtering</text></g></svg>